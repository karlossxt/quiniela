<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Pro</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tu archivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts para que se vea más pro -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-green-400">QUINIELA SEMANAL</h1>
            <p class="text-gray-400">Elige exactamente 8 partidos</p>
        </header>

        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-8">
            <label class="block mb-2 font-bold">Tu Nombre:</label>
            <input type="text" id="userName" class="w-full p-2 bg-gray-700 rounded border border-gray-600 mb-4" placeholder="Ej. Juan Pérez">
            
            <div id="contenedor-partidos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Los partidos se cargarán aquí con JS -->
            </div>

            <button id="btnEnviar" class="w-full mt-8 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">
                Enviar Pronósticos
            </button>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Tabla de Posiciones</h2>
            <div id="tabla-posiciones"></div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module" src="script.js"></script>
</body>
</html>
